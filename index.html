<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サポカSP計算</title>
<style>
:root{
  --bg:#f4f7f5; --surface:#ffffff; --ink:#2b3640; --sub:#7b8894; --line:#e2e8e4;
  --speed:#2ea8e0; --stamina:#e8524f; --power:#f5a13c; --guts:#ec6d9c; --wiz:#57b865;
  --friend:#e5b93a; --group:#9a6fd0;
  --gold1:#f9dd6f; --gold2:#eaa927; --goldink:#5c4200;
  --acc:#1d8a5f; --warn:#d2691e;
  --hud-h:50px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  padding-bottom:calc(var(--hud-h) + env(safe-area-inset-bottom));
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}

/* ---- header ---- */
header{
  display:flex;align-items:center;gap:6px;padding:6px 8px 4px;flex-wrap:wrap;
  position:sticky;top:0;background:var(--bg);z-index:20;
}
header h1{font-size:13px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
header h1 small{font-weight:600;color:var(--sub);font-size:10px;margin-left:2px}
.hset{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hsel{
  font-size:11px;font-weight:800;padding:4px 4px;border-radius:8px;
  background:var(--surface);border:1.5px solid var(--line);color:var(--ink);
  -webkit-appearance:none;appearance:none;
}
.hsel.unset{color:var(--sub);font-weight:700}
.umabox{position:relative;flex:1;min-width:110px;max-width:230px}
.umain{
  width:100%;font-size:12px;font-weight:700;padding:5px 24px 5px 10px;border-radius:999px;
  background:var(--surface);border:1.5px solid var(--line);color:var(--ink);
}
.umain.set{border-color:var(--acc)}
.umain:focus{outline:2px solid var(--acc);border-color:transparent}
.umaclear{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  font-size:12px;font-weight:900;color:var(--sub);padding:2px 6px;
}
.umalist{
  position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:60;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden;max-height:264px;overflow-y:auto;
}
.umalist button{
  display:block;width:100%;text-align:left;font-size:11px;font-weight:700;
  padding:7px 10px;border-bottom:1px solid #f0f3f1;
}
.umalist button:last-child{border-bottom:none}
.umalist button:active{background:#f2f8f4}
.umalist .none{font-size:10px;color:var(--sub);padding:8px 10px}
/* uma skills section: 1列目=白のみ / 2列目=AP進化+下位 / 3列目=AR進化+下位 */
.umasec{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:8px 6px 0}
.umasec .scnhead{background:var(--acc)}
.evohead{
  background:linear-gradient(160deg,#ffd9ec,#e8b3f0);color:#6d2a5e;
  border-radius:5px;padding:2px 3px;margin:2px;
}
.evohead .grow{cursor:pointer}
.evohead.co{opacity:.35}
.evohead.off2{opacity:.4;filter:grayscale(.4)}
.prebadge{font-size:7px;font-weight:900;color:#c26a1b;background:#fbeedd;border-radius:3px;padding:0 2px}
.lvsel{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lvsel button{font-size:11px;font-weight:700;padding:5px 7px;color:var(--sub)}
.lvsel button.on{background:var(--acc);color:#fff}
.lvlabel{font-size:10px;color:var(--sub);font-weight:700}
.kbtn{
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--sub);
}
.kbtn.on{background:#3b3550;border-color:#3b3550;color:#ffd76e}
.wrow.up{background:#f2f8f4}
.wrow.up .nm::before{content:'└';color:var(--acc);font-weight:900;margin-right:1px}
.wrow.preq{background:#fdf6e9;border-bottom:1px solid #f3e8d2}
.wrow.preq .nm::before{content:'＋';color:#c99b2e;font-weight:900;margin-right:1px}
.wrow.preq .glv{font-size:6.5px;font-weight:900;color:#c99b2e}

/* ---- slots ---- */
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:2px 8px 6px}
.slot{
  aspect-ratio:3/4;border-radius:8px;background:var(--surface);
  border:1.5px dashed var(--line);overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.slot.filled{border-style:solid}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .ph{font-size:16px;color:var(--line);font-weight:800}
.slot .noimg{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  padding:2px;font-size:8px;font-weight:800;color:#fff;text-align:center;line-height:1.15;
  word-break:break-all;
}
.slot .rb{position:absolute;left:0;top:0;font-size:7px;font-weight:900;color:#fff;padding:1px 3px;border-bottom-right-radius:5px;background:rgba(0,0,0,.45)}

/* ---- board ---- */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 6px}
.col{min-width:0}
.colhead{
  font-size:8px;font-weight:800;text-align:center;color:#fff;border-radius:5px 5px 0 0;
  padding:2px 1px;line-height:1.1;overflow:hidden;white-space:nowrap;text-overflow:clip;
}
.colbody{background:var(--surface);border-radius:0 0 6px 6px;border:1px solid var(--line);border-top:none;overflow:hidden}
.empty-col .colhead{background:var(--line);color:var(--sub)}
.empty-col .colbody{min-height:40px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--sub)}

/* gold */
.gslot{padding:2px;border-bottom:1px solid var(--line)}
.gopt{
  border-radius:5px;padding:1.5px 2px;margin-bottom:2px;position:relative;
  background:linear-gradient(160deg,var(--gold1),var(--gold2));color:var(--goldink);
}
.gopt:last-child{margin-bottom:0}
.gopt.off{background:#eceff0;color:#9aa5ad;filter:none}
.gopt.pick{cursor:pointer}
.gopt.pick.off:active{opacity:.7}
.grow{display:flex;align-items:baseline;gap:2px}
.grow .nm{-width:0;font-size:8px;font-weight:800;line-height:1.1;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grow .sp{font-size:8.5px;font-weight:900;font-variant-numeric:tabular-nums}
.glv{font-size:6.5px;font-weight:900;opacity:.75}
.gchoice-tip{font-size:7px;font-weight:800;text-align:center;color:var(--warn);padding:1px 0 2px}

/* white rows */
.wrow{
  display:flex;align-items:baseline;gap:2px;padding:1.5px 2px;border-bottom:1px solid #f0f3f1;cursor:pointer;
}
.wrow:last-child{border-bottom:none}
.wrow .nm{-width:0;font-size:8px;line-height:1.1;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.wrow .sp{font-size:8.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.wrow.dup{opacity:.38}
.wrow.dup .sp{text-decoration:line-through}
.wrow.ex{opacity:.32;background:#f2f4f3}
.wrow.ex .nm{text-decoration:line-through}
.wrow.ex .sp{text-decoration:line-through}
.wrow.co,.grow.co,.srow.co,.srad .skl.co{opacity:.28;cursor:default}
.wrow.co{background:#eef1f5}
.co .nm,.co .sp{text-decoration:line-through;text-decoration-style:dotted}
.grow{cursor:pointer}
.grow.ex{opacity:.4}
.grow.ex .nm{text-decoration:line-through}
.grow.ex .sp{text-decoration:line-through}
.exbar{display:flex;align-items:center;gap:8px;padding:2px 12px 0}

/* ---- scenario ---- */
.scn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:8px 6px 0}
.scol{min-width:0}
.scnhead{
  font-size:8px;font-weight:800;text-align:center;color:#fff;background:#5b6b7a;
  border-radius:5px 5px 0 0;padding:3px 1px;white-space:nowrap;overflow:hidden;
}
.scol .colbody{border-radius:0 0 6px 6px;border:1px solid var(--line);border-top:none;background:var(--surface);overflow:hidden}
.srow{display:flex;align-items:baseline;gap:2px;padding:1.5px 2px;border-bottom:1px solid #f0f3f1;cursor:pointer}
.srow:last-child{border-bottom:none}
.srow .nm{-width:0;font-size:8px;line-height:1.1;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.srow .sp{font-size:8.5px;font-weight:800;font-variant-numeric:tabular-nums}
.srow .glv{font-size:6.5px;font-weight:900;color:var(--sub)}
.srow.off{opacity:.35;background:#f2f4f3}
.srow.off .nm,.srow.off .sp{text-decoration:line-through}
.srow.dup{opacity:.38}
.srow.dup .sp{text-decoration:line-through}
.srad{display:block;padding:1.5px 2px;border-bottom:1px solid #f0f3f1;cursor:pointer;border-left:3px solid transparent}
.srad:last-child{border-bottom:none}
.srad .ch{font-size:7px;font-weight:800;color:var(--sub);line-height:1.1}
.srad .skl{display:flex;align-items:baseline;gap:2px}
.srad .nm{-width:0;font-size:8px;font-weight:700;line-height:1.1;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srad .sp{font-size:8.5px;font-weight:800;font-variant-numeric:tabular-nums}
.srad .glv{font-size:6.5px;font-weight:900;color:var(--sub)}
.srad.sel{border-left-color:var(--acc);background:#f2f8f4}
.srad:not(.sel){opacity:.45}
.srad .indeck{font-size:7px;font-weight:900;color:var(--acc)}
.srow.preq{background:#fdf6e9}
.srow.preq .nm::before{content:'＋';color:#c99b2e;font-weight:900;margin-right:1px}
@media (min-width:700px){
  .scnhead{font-size:11px;padding:5px 2px}
  .srow .nm,.srad .nm{font-size:11px}
  .srow .sp,.srad .sp{font-size:12px}
  .srad .ch{font-size:9.5px}
  .srow .glv,.srad .glv{font-size:9px}
}
.exbar .tip{font-size:8.5px;color:var(--sub)}
.exreset{
  font-size:10px;font-weight:800;color:var(--warn);border:1px solid var(--warn);
  border-radius:999px;padding:3px 10px;background:var(--surface);
}
.gopt.dup{opacity:.45}
.gopt.dup .sp{text-decoration:line-through}
.sp.unknown{color:var(--warn)}

/* type colors */
.t-スピード{background:var(--speed)} .t-スタミナ{background:var(--stamina)}
.t-パワー{background:var(--power)} .t-根性{background:var(--guts)}
.t-賢さ{background:var(--wiz)} .t-友人{background:var(--friend)} .t-グループ{background:var(--group)}
.t-none{background:#b8c2c9}

/* ---- HUD ---- */
.hud{
  position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--hud-h) + env(safe-area-inset-bottom));
  padding:0 12px env(safe-area-inset-bottom);
  background:linear-gradient(180deg,#20956a,var(--acc));color:#fff;
  display:flex;align-items:center;gap:10px;box-shadow:0 -2px 10px rgba(0,0,0,.15);
}
.hud .tl{font-size:10px;font-weight:800;opacity:.85;line-height:1.2}
.hud .total{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hud .total small{font-size:11px;font-weight:800;margin-left:2px;opacity:.85}
.hud .cnt{font-size:9px;font-weight:700;opacity:.85;line-height:1.5;margin-left:2px}
.hud .actions{margin-left:auto;display:flex;gap:6px}
.hud .actions button{
  font-size:11px;font-weight:800;padding:7px 11px;border-radius:8px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;
}
.hud .actions button:active{background:rgba(255,255,255,.32)}

.note{padding:6px 10px 4px;font-size:8.5px;color:var(--sub);line-height:1.6}
.note b{color:var(--warn)}

/* ---- picker ---- */
.picker{
  position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;
}
.picker.on{display:flex}
.pbar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.pbar .ttl{font-size:13px;font-weight:800}
.pbar .close{margin-left:auto;font-size:12px;font-weight:800;color:var(--sub);padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.pfilters{padding:0 12px 8px;display:flex;flex-direction:column;gap:6px}
.chiprow{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  font-size:10px;font-weight:800;padding:5px 10px;border-radius:999px;
  background:var(--surface);border:1.5px solid var(--line);color:var(--sub);
}
.chip.on{color:#fff;border-color:transparent}
.chip.on.c-SSR{background:#c99b2e}.chip.on.c-SR{background:#8d99a6}
.chip.on.c-スピード{background:var(--speed)}.chip.on.c-スタミナ{background:var(--stamina)}
.chip.on.c-パワー{background:var(--power)}.chip.on.c-根性{background:var(--guts)}
.chip.on.c-賢さ{background:var(--wiz)}.chip.on.c-友人{background:var(--friend)}.chip.on.c-グループ{background:var(--group)}
.psearch{
  width:100%;padding:8px 12px;font-size:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);
}
.psearch:focus{outline:2px solid var(--acc);border-color:transparent}
.pclear{
  font-size:11px;font-weight:800;color:#fff;background:#a8b2ba;border-radius:8px;padding:8px;width:100%;
}
.pgrid{
  padding:4px 12px 8px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start;
}
.pager{
  display:flex;align-items:center;gap:8px;padding:2px 12px 14px;margin-top:auto;
}
.pager button{
  flex:1;font-size:13px;font-weight:800;padding:11px 0;border-radius:10px;
  background:var(--surface);border:1.5px solid var(--line);color:var(--ink);
}
.pager button:disabled{opacity:.35}
.pager button:not(:disabled):active{background:var(--acc);border-color:var(--acc);color:#fff}
.pager .pg{font-size:11px;font-weight:800;color:var(--sub);white-space:nowrap;min-width:56px;text-align:center}
.pcard{border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--line);position:relative}
.pcard:active{transform:scale(.96)}
.pcard .imgbox{aspect-ratio:3/4;position:relative;overflow:hidden}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .noimg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:4px;font-size:9px;font-weight:800;color:#fff;text-align:center;line-height:1.2;word-break:break-all;
}
.pcard .rb{position:absolute;left:0;top:0;font-size:8px;font-weight:900;color:#fff;padding:1px 4px;border-bottom-right-radius:6px;background:rgba(0,0,0,.5)}
.pcard .used{position:absolute;inset:0;background:rgba(40,50,60,.55);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.pcard .nm{font-size:8px;font-weight:700;line-height:1.2;padding:3px 4px;height:2.9em;overflow:hidden;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcount{font-size:10px;color:var(--sub);font-weight:700;padding:0 12px 4px}

@media (min-width:700px){
  body{max-width:860px;margin:0 auto}
  header h1{font-size:16px}
  .colhead{font-size:11px;padding:5px 2px}
  .grow .nm,.wrow .nm{font-size:11px}
  .grow .sp,.wrow .sp{font-size:12px}
  .glv{font-size:9px}
  .pgrid{grid-template-columns:repeat(7,1fr)}
}
</style>
</head>
<body>

<header>
  <h1>サポカSP計算</h1>
  <div class="umabox">
    <input type="search" class="umain" id="umaIn" placeholder="ウマ娘名で検索" autocomplete="off">
    <button class="umaclear" id="umaClear" onclick="clearUma()" style="display:none">×</button>
    <div class="umalist" id="umaList" style="display:none"></div>
  </div>
  <div class="hset">
    <select class="hsel" id="zoomSel" onchange="setZoom(this.value)"></select>
    <select class="hsel" id="distSel" onchange="setDist(this.value)"></select>
    <select class="hsel" id="styleSel" onchange="setStyle(this.value)"></select>
    <span class="lvlabel">白Lv</span>
    <div class="lvsel" id="lvsel"></div>
    <button class="kbtn" id="kbtn" onclick="toggleKir()">切れ者</button>
  </div>
</header>

<div id="zw">
<div class="slots" id="slots"></div>
<div class="board" id="board"></div>
<div class="umasec" id="umaSec" style="display:none"></div>
<div class="scn" id="scn" style="display:none"></div>
<div class="exbar"><span class="tip">スキル名をタップで除外／もう一度タップで戻す</span><button class="exreset" id="exreset" style="display:none" onclick="resetEx()">除外をリセット</button></div>
<div class="note" id="note"></div>
</div>

<div class="hud">
  <div>
    <div class="tl">合計SP</div>
  </div>
  <div class="total" id="total">0<small>SP</small></div>
  <div class="cnt" id="cnt"></div>
  <div class="actions">
    <button onclick="copyList()" id="copyBtn">コピー</button>
    <button onclick="downloadCsv()">CSV</button>
  </div>
</div>

<div class="picker" id="picker">
  <div class="pbar">
    <span class="ttl" id="ptitle">サポカを選ぶ</span>
    <button class="close" onclick="closePicker()">閉じる</button>
  </div>
  <div class="pfilters">
    <div class="chiprow" id="rchips"></div>
    <div class="chiprow" id="tchips"></div>
    <input type="search" class="psearch" id="psearch" placeholder="キャラ名で検索（ひらがな可）" autocomplete="off">
    <button class="pclear" onclick="choose(null)">この枠を空にする</button>
  </div>
  <div class="pcount" id="pcount"></div>
  <div class="pgrid" id="pgrid"></div>
  <div class="pager">
    <button id="pgPrev" onclick="movePage(-1)">← 前へ</button>
    <span class="pg" id="pgInfo"></span>
    <button id="pgNext" onclick="movePage(1)">次へ →</button>
  </div>

var UP     = DATA.up || {}; // 下位skillIdx(文字列) → 上位(白◎)skillIdx
var DOWN   = DATA.down || {}; // skillIdx(文字列) → 直下の下位skillIdx（金特の前提チェーン）
var byNo = {}; CARDS.forEach(function(c){ byNo[c.no] = c; });
var TYPES = ['スピード','スタミナ','パワー','根性','賢さ','友人','グループ'];
var MULT  = {0:1.0, 1:0.9, 2:0.8, 3:0.7, 4:0.65, 5:0.6};   // 非切れ者
var MULTK = {0:0.9, 1:0.8, 2:0.7, 3:0.6, 4:0.55, 5:0.5};   // 切れ者

function nmParts(name){
  return esc(name) + ' ';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function charName(full){var i=String(full).lastIndexOf(']');return i>=0?full.slice(i+1):full;}
function toHira(s){return String(s).replace(/[\u30a1-\u30f6]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});}
function searchKey(full){return toHira(charName(full)).toLowerCase();}
function typeClass(t){return TYPES.indexOf(t)>=0 ? 't-'+t : 't-none';}
function imgSrc(no){return 'img/'+no+'.webp';}
function calcSp(base, lv, kir){ if(base<0) return -1; var m=(kir?MULTK:MULT)[lv]; if(m==null)m=1; return Math.floor(base*m + 1e-6); }

var store = {
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

// ---------- state ----------
var SCN = DATA.scn || null;
var UMA = DATA.uma || [];   // [{no, n, sk:[[preSi, [evoSi,...]],...]}] 進化配列は分岐込み・[]なら白のみ
var umaByNo = {}; UMA.forEach(function(u){ umaByNo[u.no]=u; });  // {fixed:[{s,lv,def}], six:[{c,in,inLv,out,outLv}], three:[{s,lv}], sixDef, threeDef}

var DIST_LIST  = ['短距離','マイル','中距離','長距離'];  // 距離ビット順(N〜Q)
var STYLE_LIST = ['逃げ','先行','差し','追込'];          // 脚質ビット順(J〜M)

var state = { slots:[null,null,null,null,null,null], gold:{}, lv:5, kir:true, ex:{}, dist:'中距離', style:'逃げ', uma:null, zoom:'85' };
(function(){
  try{ var s = JSON.parse(store.get('spcalc')||'null'); if(s && s.slots){ state = s; if(!state.ex) state.ex = {};
    if(state.dist===undefined) state.dist='中距離'; if(state.style===undefined) state.style='逃げ';
    if(state.zoom===undefined) state.zoom='85'; } }catch(e){}
})();
// 発動条件：チェック無し→OK／選択がチェックに含まれる→OK／未選択→無視してOK
function condOk(si){
  var st = SKILLS[si][2]||0, d = SKILLS[si][3]||0;
  var sOk = !st || !state.style || !!(st & (1 << STYLE_LIST.indexOf(state.style)));
  var dOk = !d  || !state.dist  || !!(d  & (1 << DIST_LIST.indexOf(state.dist)));
  return sOk && dOk;
}
function setDist(v){ state.dist=v; persist(); renderAll(); }
function setZoom(v){ state.zoom=v; persist(); renderAll(); }
var ZOOMS = [['100','表示:大'],['85','表示:中'],['70','表示:小'],['60','表示:極小']];
function renderZoom(){
  var zs=document.getElementById('zoomSel');
  zs.innerHTML = ZOOMS.map(function(z){return '<option value="'+z[0]+'"'+(state.zoom===z[0]?' selected':'')+'>'+z[1]+'</option>';}).join('');
  var zw=document.getElementById('zw');
  zw.style.zoom = (parseInt(state.zoom,10)/100);
}
function setStyle(v){ state.style=v; persist(); renderAll(); }
function renderSel(){
  var ds=document.getElementById('distSel'), ss=document.getElementById('styleSel');
  ds.innerHTML = DIST_LIST.map(function(o){return '<option value="'+o+'"'+(state.dist===o?' selected':'')+'>'+o+'</option>';}).join('')
    + '<option value=""'+(state.dist===''?' selected':'')+'>距離未選択</option>';
  ss.innerHTML = STYLE_LIST.map(function(o){return '<option value="'+o+'"'+(state.style===o?' selected':'')+'>'+o+'</option>';}).join('')
    + '<option value=""'+(state.style===''?' selected':'')+'>脚質未選択</option>';
  ds.className = 'hsel'+(state.dist===''?' unset':'');
  ss.className = 'hsel'+(state.style===''?' unset':'');
}
// シナリオ選択状態の初期化（fx=確定のON/OFF配列、six/three=選択インデックス）
(function(){
  if(!SCN) return;
  if(!state.scn) state.scn = {};
  if(!state.scn.fx || state.scn.fx.length !== SCN.fixed.length){
    state.scn.fx = SCN.fixed.map(function(f){ return f.def ? 1 : 0; });
  }
  if(state.scn.six==null || state.scn.six<0 || state.scn.six>=SCN.six.length) state.scn.six = SCN.sixDef;
  if(state.scn.three==null || state.scn.three<0 || state.scn.three>=SCN.three.length) state.scn.three = SCN.threeDef;
})();
function persist(){ store.set('spcalc', JSON.stringify(state)); }
function toggleEx(si){ if(state.ex[si]) delete state.ex[si]; else state.ex[si]=1; persist(); renderAll(); }
function resetEx(){ state.ex = {}; persist(); renderAll(); }
function toggleFx(i){ state.scn.fx[i] = state.scn.fx[i] ? 0 : 1; persist(); renderAll(); }
function pickSix(i){ state.scn.six = i; persist(); renderAll(); }
function pickThree(i){ state.scn.three = i; persist(); renderAll(); }
// 6選択：E列のキャラ名が「編成サポカ」または「選択中のウマ娘」に一致するか
function nameHit(a, b){
  a = toHira(String(a)).toLowerCase(); b = toHira(String(b)).toLowerCase();
  return a.indexOf(b)>=0 || b.indexOf(a)>=0;
}
function charaInDeck(chara){
  for(var i=0;i<6;i++){
    var no = state.slots[i]; if(no==null) continue;
    if(nameHit(charName(byNo[no].n), chara)) return true;
  }
  return false;
}
function charaIsUma(chara){
  if(state.uma==null || !umaByNo[state.uma]) return false;
  return nameHit(charName(umaByNo[state.uma].n), chara);
}

// ---------- slots ----------
function slotCardHtml(c, extra){

}
function imgFail(img){ img.style.display='none'; var n=img.nextElementSibling; if(n)n.style.display='flex'; }
function renderSlots(){
  var h='';
  for(var i=0;i<6;i++){
    var no = state.slots[i], c = no!=null ? byNo[no] : null;
    h += '<button class="slot'+(c?' filled':'')+'" onclick="openPicker('+i+')" aria-label="サポカ'+(i+1)+'">';
    h += c ? slotCardHtml(c) : '<span class="ph">＋</span>';
    h += '</button>';
  }
  document.getElementById('slots').innerHTML = h;
}

// ---------- board & totals ----------
function goldSel(c){
  if(!c.g.length) return -1;
  var v = state.gold[c.no];
  if(v==null || v<0 || v>=c.g.length) v = 0;
  return v;
}
function pickGold(no, idx){ state.gold[no]=idx; persist(); renderAll(); }

function computeRows(){
  // returns per-slot rows plus totals; 除外(ex)が最優先、次に dedup 左→右（先着カウント）
  var seen = {}, out = [], tot = 0, cg=0, cw=0, cd=0, cx={}, cc={}, unknown = [];
  // 事前パス：編成全体でヒントから取れる白の集合（白ヒント＋その上位◎）
  var deckWhite = {};
  for(var d=0; d<6; d++){
    var dc = state.slots[d]!=null ? byNo[state.slots[d]] : null;
    if(!dc) continue;
    dc.w.forEach(function(si){ deckWhite[si]=1; if(UP[si]!=null) deckWhite[UP[si]]=1; });
  }
  for(var i=0;i<6;i++){
    var no = state.slots[i], c = no!=null?byNo[no]:null;
    if(!c){ out.push(null); continue; }
    var col = { card:c, golds:[], whites:[], preqs:[], choice:c.g.length>1, sel:goldSel(c) };
    c.g.forEach(function(slot, gi){
      var opt = { idx:gi, on: gi===col.sel, items:[] };
      slot.forEach(function(p){
        var si=p[0], lv=p[1], base=SKILLS[si][1];
        var sp = calcSp(base, lv, state.kir);
        var ex = !!state.ex[si];
        var co = !condOk(si);
        var dup = false;
        if(opt.on && !ex && !co){
          dup = !!seen[si];
          if(!dup){
            seen[si]=1;
            if(sp>=0){ tot+=sp; cg++; } else { unknown.push(SKILLS[si][0]); }
          } else cd++;
        } else if(opt.on && ex){ cx[si]=1; }
        else if(opt.on && co){ cc[si]=1; }
        opt.items.push({ si:si, name:SKILLS[si][0], lv:lv, sp:sp, dup:dup, ex:ex, co:co });
        // 金特の前提下位スキル：編成のどのサポカからも取れない場合、ヒントLv0で追加
        // （前提は発動用でなく取得解放用のコストなので条件判定の対象外。金特側が条件外なら不要）
        if(opt.on && !ex && !co){
          var chain = [], cur = si;
          while(DOWN[cur]!=null){ cur = DOWN[cur]; chain.push(cur); }
          chain.reverse();  // 最下位（○）から順に取得
          chain.forEach(function(qi){
            if(deckWhite[qi]) return;   // 編成内のヒントで取れる → その列で計上済み/予定
            var qsp = calcSp(SKILLS[qi][1], 0, state.kir);
            var qex = !!state.ex[qi];
            var qdup = false;
            if(!qex){
              qdup = !!seen[qi];
              if(!qdup){
                seen[qi]=1;
                if(qsp>=0){ tot+=qsp; cw++; } else { unknown.push(SKILLS[qi][0]); }
              } else cd++;
            } else cx[qi]=1;
            col.preqs.push({ si:qi, name:SKILLS[qi][0], sp:qsp, dup:qdup, ex:qex });
          });
        }
      });
      col.golds.push(opt);
    });
    c.w.forEach(function(si){
      var base=SKILLS[si][1];
      var sp = calcSp(base, state.lv, state.kir);
      var ex = !!state.ex[si];
      var co = !condOk(si);
      var dup = false;
      if(!ex && !co){
        dup = !!seen[si];
        if(!dup){
          seen[si]=1;
          if(sp>=0){ tot+=sp; cw++; } else { unknown.push(SKILLS[si][0]); }
        } else cd++;
      } else if(ex) cx[si]=1;
      else cc[si]=1;
      col.whites.push({ si:si, name:SKILLS[si][0], sp:sp, dup:dup, ex:ex, co:co });
      // 上位白スキル（◎）を常に直後に追加（ヒントLvは下位と同じ＝一律Lv）
      if(UP[si]!=null){
        var usi = UP[si];
        var usp = calcSp(SKILLS[usi][1], state.lv, state.kir);
        var uex = !!state.ex[usi] || ex;   // 下位を除外したら上位も取れない
        var uco = !condOk(usi) || co;      // 下位が条件外なら上位も発動対象外
        var udup = false;
        if(!uex && !uco){
          udup = !!seen[usi];
          if(!udup){
            seen[usi]=1;
            if(usp>=0){ tot+=usp; cw++; } else { unknown.push(SKILLS[usi][0]); }
          } else cd++;
        } else if(state.ex[usi]) cx[usi]=1;
        else if(uco) cc[usi]=1;
        col.whites.push({ si:usi, name:SKILLS[usi][0], sp:usp, dup:udup, ex:uex, co:uco, up:true });
      }
    });
    out.push(col);
  }
  // ---- ウマ娘スキル（カードの後・シナリオの前に計上。全てヒントLv3固定）----
  // 1列目=白スキルのみ / 2列目=AP進化とその下位 / 3列目=AR進化とその下位（AT進化があれば3列目に続けて表示）
  // 進化スキルの取得コスト＝進化前スキル＋その下位チェーン全部のSP
  var umaR = null;
  if(state.uma!=null && umaByNo[state.uma]){
    var u = umaByNo[state.uma];
    umaR = { uma:u, plain:[], groups:[], count:0 };
    var ownSet = {};   // ウマ娘自身がヒントを持つスキル（覚醒＋進化前）
    u.sk.forEach(function(p){ ownSet[p[0]]=1; });
    var claimed = {};  // 進化グループが下位として使用したスキル
    var countUma = function(si, sp){
      var dup = !!seen[si];
      if(!dup){
        seen[si]=1;
        if(sp>=0){ tot+=sp; umaR.count++; } else { unknown.push(SKILLS[si][0]); }
      } else cd++;
      return dup;
    };
    // 下位白に上位（◎）があれば同じヒントLvで自動追加（カードの◎自動と同じ規則）
    var upperRow = function(lowSi, lv, lowEx, lowCo){
      if(UP[lowSi]==null) return null;
      var usi = UP[lowSi];
      var usp = SKILLS[usi][1]<0 ? -1 : calcSp(SKILLS[usi][1], lv, state.kir);
      var uex = !!state.ex[usi] || lowEx;
      var uco = !condOk(usi) || lowCo;
      var udup = false;
      if(!uex && !uco){ udup = countUma(usi, usp); }
      else if(state.ex[usi]) cx[usi]=1;
      else if(uco) cc[usi]=1;
      return { si:usi, name:SKILLS[usi][0], sp:usp, lv:lv, dup:udup, ex:uex, co:uco, up:true };
    };
    // --- 進化グループ（AP / AR / AT） ---
    u.sk.forEach(function(pair){
      var pre = pair[0], evos = pair[1];
      if(!evos.length) return;
      var g = { rows:[] };
      var spHead = SKILLS[pre][1]<0 ? -1 : calcSp(SKILLS[pre][1], 3, state.kir);
      // 分岐進化：条件を満たす進化先を順に探す（シート記載が先頭＝優先）
      var evo = evos[0], evoOk = false;
      for(var ei=0; ei<evos.length; ei++){
        if(condOk(evos[ei])){ evo = evos[ei]; evoOk = true; break; }
      }
      var preOk = condOk(pre);
      var mode = evoOk ? 'evo' : (preOk ? 'pre' : 'off');
      var headSi = mode==='pre' ? pre : evo;
      var ex = !!state.ex[headSi] || !!state.ex[pre];
      var headName = mode==='pre' ? SKILLS[pre][0]
                   : SKILLS[evo][0] + '（' + SKILLS[pre][0] + '）';
      var chain = [], cur = pre;
      while(DOWN[cur]!=null){ cur = DOWN[cur]; chain.push(cur); }
      var active = (mode!=='off') && !ex;
      var head = { si:headSi, name:headName, sp:spHead, pre:(mode==='pre'), co:(mode==='off'), ex:ex, dup:false };
      if(active){
        head.dup = seen[pre] ? true : false;
        if(!head.dup){ countUma(pre, spHead); evos.forEach(function(e){ seen[e]=1; }); }
        else cd++;
      } else if(ex) cx[headSi]=1;
      else cc[headSi]=1;
      g.rows.push(head);
      if(active && !head.dup){
        // 下位チェーンは進化取得の必須コスト：自前ヒント=Lv3、編成ヒント=白Lv、どちらも無ければLv0
        chain.forEach(function(m){
          claimed[m]=1;
          var lv = ownSet[m] ? 3 : (deckWhite[m] ? state.lv : 0);
          var msp = SKILLS[m][1]<0 ? -1 : calcSp(SKILLS[m][1], lv, state.kir);
          var mex = !!state.ex[m];
          var mdup = false;
          if(!mex){ mdup = countUma(m, msp); }
          else cx[m]=1;
          g.rows.push({ si:m, name:SKILLS[m][0], sp:msp, lv:lv, dup:mdup, ex:mex, low:true });
          var ur = upperRow(m, lv, mex, false);   // ◎は発動用なので自身の条件で判定
          if(ur) g.rows.push(ur);
        });
      } else {
        // グループ不成立：自前ヒントの下位は通常の白として1列目で扱う（claimedにしない）
      }
      umaR.groups.push(g);
    });
    // --- 1列目：白スキルのみ（進化グループが使わなかったもの） ---
    u.sk.forEach(function(pair){
      if(pair[1].length) return;
      var si = pair[0];
      if(claimed[si]) return;   // 進化の下位として2/3列目に表示済み
      var sp = SKILLS[si][1]<0 ? -1 : calcSp(SKILLS[si][1], 3, state.kir);
      var ex = !!state.ex[si];
      var co = !condOk(si);
      var dup = false;
      if(!ex && !co){ dup = countUma(si, sp); }
      else if(ex) cx[si]=1;
      else cc[si]=1;
      umaR.plain.push({ si:si, name:SKILLS[si][0], sp:sp, dup:dup, ex:ex, co:co });
      var ur = upperRow(si, 3, ex, co);
      if(ur) umaR.plain.push(ur);
    });
  }
  // ---- シナリオ固有（ボードの後に計上：重複はカード側優先）----
  var scn = null;
  if(SCN){
    scn = { fixed:[], six:[], three:[], count:0 };
    // 計上ヘルパ：{si, lv} を追加し、行情報を返す
    var takeScn = function(si, lv){
      var sp = calcSp(SKILLS[si][1], lv, state.kir);
      var ex = !!state.ex[si];
      var co = !condOk(si);
      var dup = false;
      if(!ex && !co){
        dup = !!seen[si];
        if(!dup){
          seen[si]=1;
          if(sp>=0){ tot+=sp; scn.count++; } else { unknown.push(SKILLS[si][0]); }
        } else cd++;
      } else if(ex) cx[si]=1;
      else cc[si]=1;
      return { si:si, name:SKILLS[si][0], lv:lv, sp:sp, dup:dup, ex:ex, co:co };
    };
    // 確定（ON/OFF可）・6選択・3選択をまず全て計上し、前提解決は最後にまとめて行う
    // （確定スキル同士がチェーン関係の場合にLv0で二重計上されるのを防ぐ）
    var roots = [];
    SCN.fixed.forEach(function(f, i){
      var on = !!state.scn.fx[i];
      if(on){
        var row = takeScn(f.s, f.lv);
        row.on = true; row.preqs = []; scn.fixed.push(row);
        if(!row.ex && !row.dup && !row.co) roots.push({si:f.s, row:row});
      } else {
        scn.fixed.push({ si:f.s, name:SKILLS[f.s][0], lv:f.lv,
          sp:calcSp(SKILLS[f.s][1], f.lv, state.kir), on:false, co:!condOk(f.s) });
      }
    });
    // 6選択（編成にE列サポカがいればF列、いなければH列）
    SCN.six.forEach(function(o, i){
      var inCard = charaInDeck(o.c), inUma = charaIsUma(o.c);
      var inDeck = inCard || inUma;
      var si = inDeck ? o['in'] : o.out;
      var lv = inDeck ? o.inLv : o.outLv;
      var selected = (state.scn.six === i);
      var row;
      if(selected){
        row = takeScn(si, lv);
        row.preqs = [];
        if(!row.ex && !row.dup && !row.co) roots.push({si:si, row:row});
      } else {
        row = { si:si, name:SKILLS[si][0], lv:lv, sp:calcSp(SKILLS[si][1], lv, state.kir), co:!condOk(si) };
      }
      row.chara = o.c; row.inDeck = inDeck; row.inUma = inUma && !inCard; row.sel = selected;
      scn.six.push(row);
    });
    // 3選択
    SCN.three.forEach(function(o, i){
      var selected = (state.scn.three === i);
      var row;
      if(selected){
        row = takeScn(o.s, o.lv);
        row.preqs = [];
        if(!row.ex && !row.dup && !row.co) roots.push({si:o.s, row:row});
      } else {
        row = { si:o.s, name:SKILLS[o.s][0], lv:o.lv, sp:calcSp(SKILLS[o.s][1], o.lv, state.kir), co:!condOk(o.s) };
      }
      row.sel = selected;
      scn.three.push(row);
    });
    // 前提チェーン：編成ヒント・既計上分（シナリオ付与含む）から取れないものだけLv0で追加
    // 各前提は、それを必要とする行（root）の直下に表示するため row.preqs に入れる
    roots.forEach(function(r){
      var chain=[], cur=r.si;
      while(DOWN[cur]!=null){ cur=DOWN[cur]; chain.push(cur); }
      chain.reverse();
      chain.forEach(function(qi){
        if(deckWhite[qi] || seen[qi]) return;
        r.row.preqs.push(takeScn(qi, 0));
      });
    });
  }
  return { cols:out, uma:umaR, scn:scn, total:tot, cg:cg, cw:cw, cd:cd, cx:Object.keys(cx).length, cc:Object.keys(cc).length, unknown:unknown };
}

function renderBoard(R){
  var h='';
  R.cols.forEach(function(col, i){
    if(!col){
      h += '<div class="col empty-col"><div class="colhead">'+(i+1)+'</div><div class="colbody">未選択</div></div>';
      return;
    }
    var c = col.card;
    h += '<div class="col"><div class="colhead '+typeClass(c.t)+'" title="'+esc(c.n)+'">'+esc(charName(c.n))+'</div><div class="colbody">';
    if(col.golds.length){
      h += '<div class="gslot">';
      if(col.choice) h += '<div class="gchoice-tip">▼金特を選択</div>';
      col.golds.forEach(function(opt){
        var cls = 'gopt' + (opt.on?'':' off') + (col.choice?' pick':'');
        var dupAll = opt.on && opt.items.every(function(it){return it.dup||it.ex;});
        if(dupAll) cls += ' dup';
        var click = (col.choice && !opt.on) ? ' onclick="pickGold('+c.no+','+opt.idx+')"' : '';
        h += '<div class="'+cls+'"'+click+'>';
        opt.items.forEach(function(it){
          var spTxt = it.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp'+(it.dup&&opt.on?'" style="text-decoration:line-through':'')+'">'+it.sp+'</span>';
          var exClick = (opt.on && !it.co) ? ' onclick="toggleEx('+it.si+');event.stopPropagation()"' : '';
          h += '<div class="grow'+(it.ex?' ex':'')+(it.co?' co':'')+'"'+exClick+'><span class="nm">'+nmParts(it.name)+'<span class="glv">Lv'+it.lv+'</span></span>'+spTxt+'</div>';
        });
        h += '</div>';
      });
      h += '</div>';
      if(col.preqs.length){
        col.preqs.forEach(function(q){
          var spTxt = q.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp">'+q.sp+'</span>';
          h += '<div class="wrow preq'+(q.dup?' dup':'')+(q.ex?' ex':'')+'" onclick="toggleEx('+q.si+')"><span class="nm">'+nmParts(q.name)+'<span class="glv">Lv0</span></span>'+spTxt+'</div>';
        });
      }
    }
    if(col.whites.length){
      col.whites.forEach(function(w){
        var spTxt = w.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp">'+w.sp+'</span>';
        var wClick = w.co ? '' : ' onclick="toggleEx('+w.si+')"';
        h += '<div class="wrow'+(w.dup?' dup':'')+(w.ex?' ex':'')+(w.up?' up':'')+(w.co?' co':'')+'"'+wClick+'><span class="nm">'+nmParts(w.name)+'</span>'+spTxt+'</div>';
      });
    } else if(!col.golds.length){
      h += '<div class="wrow"><span class="nm" style="color:var(--sub)">ヒントなし</span></div>';
    }
    h += '</div></div>';
  });
  document.getElementById('board').innerHTML = h;
}

function umaSearchKey(u){ return toHira(u.n).toLowerCase(); }
function renderUmaIn(){
  var inp = document.getElementById('umaIn');
  var u = state.uma!=null ? umaByNo[state.uma] : null;
  inp.value = u ? u.n : '';
  inp.className = 'umain' + (u?' set':'');
  document.getElementById('umaClear').style.display = u ? '' : 'none';
}
function showUmaList(q){
  var box = document.getElementById('umaList');
  var key = toHira(q||'').toLowerCase().trim();
  if(!key){ box.style.display='none'; return; }
  var hits = UMA.filter(function(u){ return umaSearchKey(u).indexOf(key)>=0; }).slice(0,12);
  if(!hits.length){ box.innerHTML='<div class="none">該当なし</div>'; box.style.display=''; return; }
  box.innerHTML = hits.map(function(u){
    return '<button onclick="chooseUma('+u.no+')">'+esc(u.n)+'</button>';
  }).join('');
  box.style.display='';
}
document.getElementById('umaIn').addEventListener('input', function(){ showUmaList(this.value); });
document.getElementById('umaIn').addEventListener('focus', function(){ this.select(); if(this.value && (state.uma==null || umaByNo[state.uma].n!==this.value)) showUmaList(this.value); });
document.addEventListener('click', function(e){
  var box=document.getElementById('umaList');
  if(box.style.display!=='none' && !e.target.closest('.umabox')) box.style.display='none';
});
function chooseUma(no){
  state.uma = no; persist();
  document.getElementById('umaList').style.display='none';
  renderAll();
}
function clearUma(){ state.uma=null; persist(); renderAll(); }

function umaRowHtml(w, cls){
  var spTxt = w.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp">'+w.sp+'</span>';
  var lvTag = (w.lv!=null && !w.co) ? ' <span class="glv">Lv'+w.lv+'</span>' : '';
  var click = w.co ? '' : ' onclick="toggleEx('+w.si+')"';
  return '<div class="srow '+cls+(w.up?' up':'')+(w.dup?' dup':'')+(w.ex?' off':'')+(w.co?' co':'')+'"'+click+
    '><span class="nm">'+nmParts(w.name)+(w.pre?'<span class="prebadge">進化前</span>':'')+lvTag+'</span>'+spTxt+'</div>';
}
function renderUma(R){
  var el=document.getElementById('umaSec');
  if(!R.uma){ el.style.display='none'; return; }
  el.style.display='';
  var g1 = R.uma.groups[0], g2 = R.uma.groups[1];
  var extra = R.uma.groups.slice(2);   // AT進化があれば3列目に続けて表示
  var h='';
  // 1列目：白スキルのみ
  h += '<div class="scol"><div class="scnhead">'+esc(charName(R.uma.uma.n))+'：白スキル</div><div class="colbody">';
  R.uma.plain.forEach(function(w){ h += umaRowHtml(w, ''); });
  if(!R.uma.plain.length) h += '<div class="srow"><span class="nm" style="color:var(--sub)">なし</span></div>';
  h += '</div></div>';
  // 2・3列目：進化グループ
  [ [g1,'進化スキル①'], [g2,'進化スキル②'] ].forEach(function(pair, gi){
    var g = pair[0];
    h += '<div class="scol"><div class="scnhead">'+pair[1]+'（Lv3）</div><div class="colbody">';
    var list = g ? [g] : [];
    if(gi===1) list = list.concat(extra);
    if(!list.length) h += '<div class="srow"><span class="nm" style="color:var(--sub)">なし</span></div>';
    list.forEach(function(grp){
      grp.rows.forEach(function(w, ri){
        if(ri===0){
          var spTxt = w.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp'+(w.dup?'" style="text-decoration:line-through':'')+'">'+w.sp+'</span>';
          var click = w.co ? '' : ' onclick="toggleEx('+w.si+');event.stopPropagation()"';
          h += '<div class="evohead'+(w.co?' co':'')+(w.ex?' off2':'')+'"><div class="grow"'+click+'><span class="nm">'+nmParts(w.name)+(w.pre?'<span class="prebadge">進化前</span>':'')+'</span>'+spTxt+'</div></div>';
        } else {
          h += umaRowHtml(w, '');
        }
      });
    });
    h += '</div></div>';
  });
  el.innerHTML = h;
}
function scnPreqHtml(row){
  if(!row.preqs || !row.preqs.length) return '';
  return row.preqs.map(function(q){
    var spTxt = q.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp">'+q.sp+'</span>';
    return '<div class="srow preq'+(q.dup?' dup':'')+(q.ex?' off':'')+'" onclick="toggleEx('+q.si+')"><span class="nm">'+nmParts(q.name)+'<span class="glv">Lv0</span></span>'+spTxt+'</div>';
  }).join('');
}
function renderScn(R){
  var el = document.getElementById('scn');
  if(!R.scn){ el.style.display='none'; return; }
  el.style.display='';
  var S = R.scn, h='';
  // 確定
  h += '<div class="scol"><div class="scnhead">シナリオ確定</div><div class="colbody">';
  S.fixed.forEach(function(f, i){
    if(!f.on){
      h += '<div class="srow off'+(f.co?' co':'')+'" onclick="toggleFx('+i+')"><span class="nm">'+nmParts(f.name)+'<span class="glv">Lv'+f.lv+'</span></span><span class="sp">'+(f.sp<0?'？':f.sp)+'</span></div>';
    } else {
      var spTxt = f.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp">'+f.sp+'</span>';
      h += '<div class="srow'+(f.dup?' dup':'')+(f.ex?' off':'')+(f.co?' co':'')+'" onclick="toggleFx('+i+')"><span class="nm">'+nmParts(f.name)+'<span class="glv">Lv'+f.lv+'</span></span>'+spTxt+'</div>';
      h += scnPreqHtml(f);
    }
  });
  h += '</div></div>';
  // 6選択
  h += '<div class="scol"><div class="scnhead">6選択（サポカ連動）</div><div class="colbody">';
  S.six.forEach(function(o, i){
    var spTxt = o.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp'+(o.sel&&o.dup?'" style="text-decoration:line-through':'')+'">'+o.sp+'</span>';
    h += '<div class="srad'+(o.sel?' sel':'')+'" onclick="pickSix('+i+')">'+
      '<div class="ch">'+esc(o.chara)+(o.inDeck?' <span class="indeck">'+(o.inUma?'育成中':'編成中')+'</span>':'')+'</div>'+
      '<div class="skl'+(o.co?' co':'')+'"><span class="nm">'+nmParts(o.name)+'<span class="glv">Lv'+o.lv+'</span></span>'+spTxt+'</div></div>';
    if(o.sel) h += scnPreqHtml(o);
  });
  h += '</div></div>';
  // 3選択
  h += '<div class="scol"><div class="scnhead">3選択</div><div class="colbody">';
  S.three.forEach(function(o, i){
    var spTxt = o.sp<0 ? '<span class="sp unknown">？</span>' : '<span class="sp'+(o.sel&&o.dup?'" style="text-decoration:line-through':'')+'">'+o.sp+'</span>';
    h += '<div class="srad'+(o.sel?' sel':'')+'" onclick="pickThree('+i+')">'+
      '<div class="skl'+(o.co?' co':'')+'"><span class="nm">'+nmParts(o.name)+'<span class="glv">Lv'+o.lv+'</span></span>'+spTxt+'</div></div>';
    if(o.sel) h += scnPreqHtml(o);
  });
  h += '</div></div>';
  el.innerHTML = h;
}

function renderAll(){
  renderZoom(); renderSel(); renderLv(); renderSlots(); renderUmaIn();
  var R = computeRows();
  renderBoard(R);
  renderUma(R);
  renderScn(R);
  document.getElementById('total').innerHTML = R.total.toLocaleString() + '<small>SP</small>';
  var sub = [];
  if(R.cd) sub.push('重複'+R.cd);
  if(R.cx) sub.push('除外'+R.cx);
  if(R.cc) sub.push('条件外'+R.cc);
  var cnts = '金'+R.cg+'・白'+R.cw + (R.uma?'・ウマ'+R.uma.count:'') + (R.scn?'・固有'+R.scn.count:'');
  document.getElementById('cnt').innerHTML = cnts + (sub.length?'<br>'+sub.join('・'):'');
  document.getElementById('exreset').style.display = R.cx ? '' : 'none';
  var notes = [];
  var hasPreq = R.cols.some(function(c){ return c && c.preqs.length; });
  if(hasPreq) notes.push('「＋」の行は金特の取得に必要な下位スキルです。編成のヒントでは取れないためヒントLv0（軽減なし）で計上しています。');
  if(R.cc) notes.push('点線取り消しのスキルは選択中の距離・脚質では発動条件を満たさないため、自動で合計から除外しています。');
  if(R.cd) notes.push('薄い表示のスキルは他のサポカと重複しており、合計SPには1回だけ計上しています。');
  if(R.unknown.length){
    var u = {}; R.unknown.forEach(function(n){u[n]=1;});
    notes.push('<b>SP不明（合計に未計上）：</b>' + Object.keys(u).map(esc).join('、') + '（スキルデータ未登録）');
  }
  var memos = [];
  state.slots.forEach(function(no){ var c=no!=null?byNo[no]:null; if(c && c.memo) memos.push(esc(charName(c.n))+'：'+esc(c.memo)); });
  if(memos.length) notes.push('※ ' + memos.join(' ／ '));
  document.getElementById('note').innerHTML = notes.join('<br>');
}

// ---------- export ----------
function buildRows(){
  var R = computeRows(), rows = [['サポカ','区分','スキル','Lv','SP','備考']];
  R.cols.forEach(function(col){
    if(!col) return;
    var cn = col.card.n;
    col.golds.forEach(function(opt){
      if(!opt.on) return;
      opt.items.forEach(function(it){
        rows.push([cn,'金',it.name,'Lv'+it.lv, it.sp<0?'不明':it.sp, it.ex?'除外':(it.co?'条件外':(it.dup?'重複':''))]);
      });
    });
    col.preqs.forEach(function(q){
      rows.push([cn,'前提白',q.name,'Lv0', q.sp<0?'不明':q.sp, q.ex?'除外':(q.dup?'重複':'')]);
    });
    col.whites.forEach(function(w){
      rows.push([cn, w.up?'白◎':'白', w.name,'Lv'+state.lv, w.sp<0?'不明':w.sp, w.ex?'除外':(w.co?'条件外':(w.dup?'重複':''))]);
    });
  });
  if(R.uma){
    var un = charName(R.uma.uma.n);
    R.uma.groups.forEach(function(g){
      g.rows.forEach(function(w, ri){
        rows.push(['ウマ娘（'+un+'）', ri===0?(w.pre?'進化前':'進化'):(w.up?'白◎':'下位白'), w.name, 'Lv'+(w.lv!=null?w.lv:3), w.sp<0?'不明':w.sp, w.ex?'除外':(w.co?'条件外':(w.dup?'重複':''))]);
      });
    });
    R.uma.plain.forEach(function(w){
      rows.push(['ウマ娘（'+un+'）', w.up?'白◎':'覚醒白', w.name,'Lv3', w.sp<0?'不明':w.sp, w.ex?'除外':(w.co?'条件外':(w.dup?'重複':''))]);
    });
  }
  if(R.scn){
    var pushScnPreqs = function(row){
      (row.preqs||[]).forEach(function(q){
        rows.push(['シナリオ','前提白',q.name,'Lv0', q.sp<0?'不明':q.sp, q.ex?'除外':(q.dup?'重複':'')]);
      });
    };
    R.scn.fixed.forEach(function(f){
      if(!f.on) return;
      rows.push(['シナリオ','確定',f.name,'Lv'+f.lv, f.sp<0?'不明':f.sp, f.ex?'除外':(f.co?'条件外':(f.dup?'重複':''))]);
      pushScnPreqs(f);
    });
    R.scn.six.forEach(function(o){
      if(!o.sel) return;
      rows.push(['シナリオ','6選択（'+o.chara+(o.inDeck?(o.inUma?'・育成中':'・編成中'):'')+'）',o.name,'Lv'+o.lv, o.sp<0?'不明':o.sp, o.ex?'除外':(o.co?'条件外':(o.dup?'重複':''))]);
      pushScnPreqs(o);
    });
    R.scn.three.forEach(function(o){
      if(!o.sel) return;
      rows.push(['シナリオ','3選択',o.name,'Lv'+o.lv, o.sp<0?'不明':o.sp, o.ex?'除外':(o.co?'条件外':(o.dup?'重複':''))]);
      pushScnPreqs(o);
    });
  }
  rows.push(['合計','','','',R.total, state.kir?'切れ者':'']);
  return rows;
}
function copyList(){
  var text = buildRows().map(function(r){return r.join('\t');}).join('\n');
  function done(){ var b=document.getElementById('copyBtn'); b.textContent='コピー済'; setTimeout(function(){b.textContent='コピー';},1200); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
function downloadCsv(){
  var csv = buildRows().map(function(r){
    return r.map(function(v){ v=String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',');
  }).join('\r\n');
  var blob = new Blob(['\ufeff'+csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'サポカSP.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// ---------- picker ----------
// 表示順：新しい実装順（SSRブロック→SRブロック、各ブロック内はNo.降順＝新しい順）
var PICK_ORDER = CARDS.slice().sort(function(a,b){
  var ra = a.r==='SSR'?0:1, rb = b.r==='SSR'?0:1;
  if(ra!==rb) return ra-rb;
  return b.no - a.no;
});
var pk = { slot:0, rar:'', type:'', q:'', page:0 };
function pageCols(){ return window.matchMedia('(min-width:700px)').matches ? 7 : 4; }
function pageSize(){ return pageCols() * 2; }  // 常に上下2段まで
function openPicker(i){
  pk.slot = i; pk.page = 0;
  document.getElementById('ptitle').textContent = 'サポカ'+(i+1)+'を選ぶ';
  document.getElementById('picker').classList.add('on');
  document.body.style.overflow = 'hidden';
  renderChips(); renderGrid();
}
function closePicker(){
  document.getElementById('picker').classList.remove('on');
  document.body.style.overflow = '';
}
function setRar(r){ pk.rar = (pk.rar===r?'':r); pk.page=0; renderChips(); renderGrid(); }
function setType(t){ pk.type = (pk.type===t?'':t); pk.page=0; renderChips(); renderGrid(); }
function movePage(d){ pk.page += d; renderGrid(); }
function renderChips(){
  document.getElementById('rchips').innerHTML = ['SSR','SR'].map(function(r){
    return '<button class="chip c-'+r+(pk.rar===r?' on':'')+'" onclick="setRar(\''+r+'\')">'+r+'</button>';
  }).join('');
  document.getElementById('tchips').innerHTML = TYPES.map(function(t){
    return '<button class="chip c-'+t+(pk.type===t?' on':'')+'" onclick="setType(\''+t+'\')">'+t+'</button>';
  }).join('');
}
document.getElementById('psearch').addEventListener('input', function(){
  pk.q = toHira(this.value).toLowerCase().trim(); pk.page=0; renderGrid();
});
function filtered(){
  return PICK_ORDER.filter(function(c){
    if(pk.rar && c.r!==pk.rar) return false;
    if(pk.type && c.t!==pk.type) return false;
    if(pk.q && searchKey(c.n).indexOf(pk.q)<0) return false;
    return true;
  });
}
function renderGrid(){
  var list = filtered();
  var size = pageSize();
  var pages = Math.max(1, Math.ceil(list.length / size));
  if(pk.page > pages-1) pk.page = pages-1;
  if(pk.page < 0) pk.page = 0;
  var view = list.slice(pk.page*size, pk.page*size + size);
  document.getElementById('pcount').textContent = list.length + '枚（新しい順）';
  document.getElementById('pgInfo').textContent = (pk.page+1) + ' / ' + pages;
  document.getElementById('pgPrev').disabled = pk.page<=0;
  document.getElementById('pgNext').disabled = pk.page>=pages-1;
  var used = {};
  state.slots.forEach(function(no,i){ if(no!=null && i!==pk.slot) used[no]=i+1; });
  var h='';
  view.forEach(function(c){
    var u = used[c.no];
    h += '<button class="pcard" onclick="choose('+c.no+')">'+
      '<div class="imgbox '+typeClass(c.t)+'">'+
        '<img src="'+imgSrc(c.no)+'" alt="" loading="lazy" onerror="imgFail(this)">'+
        '<div class="noimg" style="display:none">'+esc(charName(c.n))+'</div>'+
        '<span class="rb">'+esc(c.r)+'</span>'+
        (u?'<div class="used">枠'+u+'</div>':'')+
      '</div>'+
      '<div class="nm">'+esc(c.n)+'</div>'+
    '</button>';
  });
  document.getElementById('pgrid').innerHTML = h;
}
function choose(no){
  if(no!=null){
    // 別枠に同じカードがあれば外す（入れ替え）
    for(var i=0;i<6;i++) if(i!==pk.slot && state.slots[i]===no) state.slots[i]=null;
  }
  state.slots[pk.slot] = no;
  persist(); closePicker(); renderAll();
}

renderAll();
</script>
